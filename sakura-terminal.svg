<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 840 390" width="840" height="390" role="img" aria-label="Terminal: Camelia Tran, AI Engineer at Bosch. Interested in RAG, agentic AI, LLM orchestration and edge computer vision.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .prompt { fill: #ff7aa8; font-weight: 700; }
    .cmd { fill: #ffd9e6; }
    .out { fill: #efe4f2; }
    .dim { fill: #9c8aa8; }
    .pink { fill: #ff9dbd; }
    .title { fill: #9c8aa8; font-size: 13px; }

    /* lines appear one after another */
    .l { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1; } }

    /* typing: a background-coloured cover slides off each command */
    .cover { fill: #1a1320; }
    .t1 { animation: type1 .7s steps(6) .5s forwards; }
    .t2 { animation: type2 1s steps(11) 2.1s forwards; }
    .t3 { animation: type3 1.4s steps(17) 4.1s forwards; }
    @keyframes type1 { 0% { transform: translateX(0); } 99% { transform: translateX(70px); opacity: 1; } 100% { transform: translateX(70px); opacity: 0; } }
    @keyframes type2 { 0% { transform: translateX(0); } 99% { transform: translateX(120px); opacity: 1; } 100% { transform: translateX(120px); opacity: 0; } }
    @keyframes type3 { 0% { transform: translateX(0); } 99% { transform: translateX(180px); opacity: 1; } 100% { transform: translateX(180px); opacity: 0; } }

    .cursor { fill: #ff7aa8; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* sakura */
    .fall { animation: fall linear infinite; }
    .sway { animation: sway ease-in-out infinite alternate; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin linear infinite; }
    @keyframes fall { from { transform: translateY(-30px); } to { transform: translateY(420px); } }
    @keyframes sway { from { transform: translateX(-22px); } to { transform: translateX(22px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .branch { transform-box: fill-box; transform-origin: 100% 0; animation: breeze 6s ease-in-out infinite alternate; }
    @keyframes breeze { from { transform: rotate(-1.2deg); } to { transform: rotate(1.6deg); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .l { opacity: 1; }
      .cover { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="win"><rect width="840" height="390" rx="14"/></clipPath>
    <path id="petal" d="M0,-7 C4.5,-5 5.5,2 0,7 C-5.5,2 -4.5,-5 0,-7 Z"/>
    <g id="blossom">
      <g fill="#ffc2d6">
        <ellipse cy="-7" rx="4.6" ry="7"/>
        <ellipse cy="-7" rx="4.6" ry="7" transform="rotate(72)"/>
        <ellipse cy="-7" rx="4.6" ry="7" transform="rotate(144)"/>
        <ellipse cy="-7" rx="4.6" ry="7" transform="rotate(216)"/>
        <ellipse cy="-7" rx="4.6" ry="7" transform="rotate(288)"/>
      </g>
      <circle r="3.4" fill="#ff7aa8"/>
      <circle r="1.4" fill="#ffe08a"/>
    </g>
    <radialGradient id="glow" cx="85%" cy="15%" r="70%">
      <stop offset="0" stop-color="#ff7aa8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff7aa8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#win)">
    <!-- window -->
    <rect width="840" height="390" fill="#1a1320"/>
    <rect width="840" height="390" fill="url(#glow)"/>
    <rect width="840" height="38" fill="#261b30"/>
    <circle cx="22" cy="19" r="6" fill="#ff6b81"/>
    <circle cx="42" cy="19" r="6" fill="#ffc46b"/>
    <circle cx="62" cy="19" r="6" fill="#7bd88f"/>
    <text class="title" x="420" y="24" text-anchor="middle">camelia@sakura: ~</text>

    <!-- sakura branch -->
    <g class="branch">
      <g fill="none" stroke="#6b4a55" stroke-linecap="round">
        <path d="M850,52 C790,62 730,100 660,112 C632,117 610,130 592,150" stroke-width="5"/>
        <path d="M748,90 C742,125 728,150 700,172" stroke-width="3"/>
        <path d="M700,104 C688,86 668,74 644,68" stroke-width="2.6"/>
        <path d="M800,64 C798,105 806,135 790,170" stroke-width="3"/>
        <path d="M640,116 C632,140 640,160 630,182" stroke-width="2.2"/>
      </g>
      <use xlink:href="#blossom" href="#blossom" transform="translate(592,150) scale(1.25)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(700,172) scale(1.15) rotate(20)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(644,68) rotate(40)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(790,170) scale(1.2) rotate(10)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(630,182) scale(.95) rotate(55)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(735,100) scale(1.1) rotate(30)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(668,112) scale(.9) rotate(15)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(772,74) scale(1.05) rotate(60)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(803,112) scale(.85) rotate(5)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(738,140) scale(.8) rotate(45)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(680,84) scale(.75) rotate(25)"/>
      <circle cx="716" cy="128" r="3.2" fill="#ff9dbd"/>
      <circle cx="616" cy="134" r="3" fill="#ff9dbd"/>
      <circle cx="794" cy="142" r="2.8" fill="#ff9dbd"/>
    </g>

    <!-- session -->
    <g class="l" style="animation-delay:.3s">
      <text x="28" y="78"><tspan class="prompt">❯ </tspan><tspan class="cmd">whoami</tspan></text>
      <rect class="cover t1" x="46" y="62" width="200" height="22"/>
    </g>
    <g class="l" style="animation-delay:1.4s">
      <text class="out" x="28" y="105">Camelia Tran <tspan class="dim">(Trần Thị Kim Huỳnh)</tspan></text>
    </g>

    <g class="l" style="animation-delay:1.9s">
      <text x="28" y="142"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat now.txt</tspan></text>
      <rect class="cover t2" x="46" y="126" width="240" height="22"/>
    </g>
    <g class="l" style="animation-delay:3.3s">
      <text class="out" x="28" y="169">AI Engineer <tspan class="pink">@ Bosch</tspan> <tspan class="dim">· Ho Chi Minh City, Vietnam</tspan></text>
    </g>

    <g class="l" style="animation-delay:3.9s">
      <text x="28" y="206"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat interests.txt</tspan></text>
      <rect class="cover t3" x="46" y="190" width="300" height="22"/>
    </g>
    <g class="l" style="animation-delay:5.7s"><text class="out" x="28" y="233"><tspan class="pink">✿ </tspan>RAG &amp; retrieval systems</text></g>
    <g class="l" style="animation-delay:6.0s"><text class="out" x="28" y="260"><tspan class="pink">✿ </tspan>multi-agent &amp; agentic AI</text></g>
    <g class="l" style="animation-delay:6.3s"><text class="out" x="28" y="287"><tspan class="pink">✿ </tspan>LLM orchestration</text></g>
    <g class="l" style="animation-delay:6.6s"><text class="out" x="28" y="314"><tspan class="pink">✿ </tspan>edge computer vision</text></g>

    <g class="l" style="animation-delay:7.1s">
      <text x="28" y="351"><tspan class="prompt">❯ </tspan></text>
      <rect class="cursor" x="47" y="337" width="9" height="18"/>
    </g>

    <!-- falling petals -->
    <g opacity=".9">
      <g transform="translate(60,0)"><g class="fall" style="animation-duration:11s;animation-delay:-2s"><g class="sway" style="animation-duration:3.1s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffc2d6" style="animation-duration:5s"/></g></g></g>
      <g transform="translate(150,0)"><g class="fall" style="animation-duration:14s;animation-delay:-9s"><g class="sway" style="animation-duration:3.8s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ff9dbd" style="animation-duration:7s"/></g></g></g>
      <g transform="translate(235,0)"><g class="fall" style="animation-duration:9s;animation-delay:-5s"><g class="sway" style="animation-duration:2.6s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffe3ec" style="animation-duration:4s"/></g></g></g>
      <g transform="translate(320,0)"><g class="fall" style="animation-duration:13s;animation-delay:-1s"><g class="sway" style="animation-duration:3.4s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffc2d6" style="animation-duration:6s"/></g></g></g>
      <g transform="translate(400,0)"><g class="fall" style="animation-duration:10s;animation-delay:-7s"><g class="sway" style="animation-duration:2.9s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ff9dbd" style="animation-duration:5.5s"/></g></g></g>
      <g transform="translate(470,0)"><g class="fall" style="animation-duration:15s;animation-delay:-12s"><g class="sway" style="animation-duration:4.2s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffe3ec" style="animation-duration:8s"/></g></g></g>
      <g transform="translate(540,0)"><g class="fall" style="animation-duration:8.5s;animation-delay:-3s"><g class="sway" style="animation-duration:2.4s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffc2d6" style="animation-duration:4.5s"/></g></g></g>
      <g transform="translate(600,0)"><g class="fall" style="animation-duration:12s;animation-delay:-6s"><g class="sway" style="animation-duration:3.6s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ff9dbd" style="animation-duration:6.5s"/></g></g></g>
      <g transform="translate(655,0)"><g class="fall" style="animation-duration:9.5s;animation-delay:-8s"><g class="sway" style="animation-duration:2.8s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffc2d6" style="animation-duration:5s"/></g></g></g>
      <g transform="translate(705,0)"><g class="fall" style="animation-duration:13.5s;animation-delay:-4s"><g class="sway" style="animation-duration:3.9s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffe3ec" style="animation-duration:7.5s"/></g></g></g>
      <g transform="translate(750,0)"><g class="fall" style="animation-duration:10.5s;animation-delay:-10s"><g class="sway" style="animation-duration:3.2s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ff9dbd" style="animation-duration:5.2s"/></g></g></g>
      <g transform="translate(795,0)"><g class="fall" style="animation-duration:11.5s;animation-delay:-.5s"><g class="sway" style="animation-duration:3s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffc2d6" style="animation-duration:6s"/></g></g></g>
      <g transform="translate(505,0)"><g class="fall" style="animation-duration:16s;animation-delay:-14s"><g class="sway" style="animation-duration:4.5s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ffc2d6" style="animation-duration:9s" transform="scale(1.4)"/></g></g></g>
      <g transform="translate(110,0)"><g class="fall" style="animation-duration:17s;animation-delay:-11s"><g class="sway" style="animation-duration:4.8s"><use class="spin" xlink:href="#petal" href="#petal" fill="#ff9dbd" style="animation-duration:9.5s" transform="scale(1.3)"/></g></g></g>
    </g>
  </g>
</svg>
